  <text x="95" y="665" font-family="Arial, sans-serif" font-size="17" fill="#334155">This project is not just a resume parser; it acts as an intelligent career assistant that evaluates, guides, and improves candidate readiness using AI.</text>
  <text x="95" y="695" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#047857">Impact: Resume Analyzer only = 5/10. Resume + Adaptive Interview + Skill Gap + Recommendation = 9/10.</text>

  <rect x="70" y="745" width="1260" height="80" rx="12" fill="#0f1b35"/>
  <text x="700" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Placement Perspective + Research Paper + Final Year Major Project</text>
  <text x="700" y="812" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">NLP | Machine Learning | Adaptive Assessment | Recommendation System | Recruitment Analytics</text>
